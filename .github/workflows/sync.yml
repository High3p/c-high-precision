name: Sync from Gitee
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone from Gitee
        run: |
          git clone --mirror https://gitee.com/High_P/high-precision.git tmp
          cd tmp
          git push --mirror https://github.com/High3p/c-high-precision.git
