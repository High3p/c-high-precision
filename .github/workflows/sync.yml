name: Sync from Gitee
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync from Gitee to GitHub
        env:
          GITEE_REPO: https://gitee.com/High_P/high-precision.git
          GITHUB_REPO: "https://x-access-token:${{ secrets.HP_PAT }}@github.com/High3p/c-high-precision.git"
        run: |
          set -eu
          rm -rf tmp
          git clone --mirror "$GITEE_REPO" tmp
          cd tmp
          git push "$GITHUB_REPO" master:master --force
          git push "$GITHUB_REPO" --tags
